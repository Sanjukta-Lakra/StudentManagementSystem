<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Course</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .edit-container {

            width: 100%;

            max-width: 600px;

            margin: auto;
        }


        /* =========================
           CARD
        ========================= */

        .edit-card {

            background: #ffffff;

            border: none;

            border-radius: 16px;

            padding: 28px;

            width: 100%;

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.10);
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            color: #172554;

            font-size: 28px;

            font-weight: 700;

            text-align: center;

            margin-bottom: 25px;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            margin-bottom: 17px;
        }


        /* =========================
           LABEL
        ========================= */

        .form-label {

            color: #334155;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 6px;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-control,
        .form-select {

            min-height: 44px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 14px;

            padding: 8px 12px;

            transition: 0.2s;
        }


        .form-control:focus,
        .form-select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        .form-select {

            cursor: pointer;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        textarea.form-control {

            min-height: 85px;

            resize: vertical;
        }


        /* =========================
           BUTTON ROW
        ========================= */

        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 22px;

            flex-wrap: wrap;
        }


        /* =========================
           BUTTONS
        ========================= */

        .update-btn,
        .cancel-btn {

            min-height: 44px;

            padding: 8px 18px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            transition: 0.3s;
        }


        /* =========================
           UPDATE BUTTON
        ========================= */

        .update-btn {

            background: #2563eb;

            border-color: #2563eb;

            color: white;
        }


        .update-btn:hover {

            background: #1d4ed8;

            border-color: #1d4ed8;

            color: white;

            transform: translateY(-1px);

            box-shadow:
                0 4px 10px rgba(37, 99, 235, 0.20);
        }


        /* =========================
           CANCEL BUTTON
        ========================= */

        .cancel-btn {

            background: #64748b;

            border-color: #64748b;

            color: white;

            text-decoration: none;
        }


        .cancel-btn:hover {

            background: #475569;

            border-color: #475569;

            color: white;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 768px) {

            body {

                padding: 20px 15px;
            }


            .edit-container {

                max-width: 560px;
            }


            .edit-card {

                padding: 25px;
            }


            .title {

                font-size: 26px;

                margin-bottom: 23px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            body {

                padding: 15px 10px;

                align-items: center;
            }


            .edit-container {

                max-width: 100%;
            }


            .edit-card {

                padding: 22px 18px;

                border-radius: 14px;
            }


            .title {

                font-size: 23px;

                margin-bottom: 20px;
            }


            .form-group {

                margin-bottom: 15px;
            }


            .form-label {

                font-size: 13px;
            }


            .form-control,
            .form-select {

                min-height: 43px;

                font-size: 13px;

                padding: 8px 11px;
            }


            textarea.form-control {

                min-height: 80px;
            }


            .button-row {

                flex-direction: column;

                gap: 9px;

                margin-top: 20px;
            }


            .update-btn,
            .cancel-btn {

                width: 100%;

                min-height: 44px;

                font-size: 13px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 360px) {

            body {

                padding: 10px 8px;
            }


            .edit-card {

                padding: 20px 15px;

                border-radius: 13px;
            }


            .title {

                font-size: 21px;

                margin-bottom: 18px;
            }


            .form-control,
            .form-select {

                min-height: 42px;

                font-size: 13px;
            }


            textarea.form-control {

                min-height: 75px;
            }


            .update-btn,
            .cancel-btn {

                min-height: 43px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="edit-container">


    <!-- =========================
         EDIT CARD
    ========================= -->

    <div class="edit-card">


        <!-- TITLE -->

        <h1 class="title">

            Edit Course

        </h1>


        <!-- =========================
             FORM
        ========================= -->

        <form
            th:action="@{/admin/courses/update/{id}(id=${course.id})}"
            method="post">


            <!-- CSRF TOKEN -->

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- =========================
                 COURSE NAME
            ========================= -->

            <div class="form-group">

                <label
                    for="courseName"
                    class="form-label">

                    Course Name

                </label>


                <input
                    id="courseName"
                    type="text"
                    name="courseName"
                    th:value="${course.courseName}"
                    class="form-control"
                    placeholder="Enter course name"
                    required>

            </div>


            <!-- =========================
                 DESCRIPTION
            ========================= -->

            <div class="form-group">

                <label
                    for="description"
                    class="form-label">

                    Description

                </label>


                <textarea
                    id="description"
                    name="description"
                    class="form-control"
                    rows="3"
                    placeholder="Enter course description"
                    required
                    th:text="${course.description}">
                </textarea>

            </div>


            <!-- =========================
                 DURATION
            ========================= -->

            <div class="form-group">

                <label
                    for="duration"
                    class="form-label">

                    Duration

                </label>


                <input
                    id="duration"
                    type="text"
                    name="duration"
                    th:value="${course.duration}"
                    class="form-control"
                    placeholder="Example: 6 Months"
                    required>

            </div>


            <!-- =========================
                 FEES
            ========================= -->

            <div class="form-group">

                <label
                    for="fees"
                    class="form-label">

                    Fees

                </label>


                <input
                    id="fees"
                    type="number"
                    name="fees"
                    th:value="${course.fees}"
                    class="form-control"
                    placeholder="Enter course fees"
                    min="0"
                    required>

            </div>


            <!-- =========================
                 MODE
            ========================= -->

            <div class="form-group">

                <label
                    for="mode"
                    class="form-label">

                    Mode

                </label>


                <select
                    id="mode"
                    name="mode"
                    class="form-select"
                    required>


                    <option
                        value="Online"
                        th:selected="${course.mode == 'Online'}">

                        Online

                    </option>


                    <option
                        value="Offline"
                        th:selected="${course.mode == 'Offline'}">

                        Offline

                    </option>


                    <option
                        value="Hybrid"
                        th:selected="${course.mode == 'Hybrid'}">

                        Hybrid

                    </option>


                </select>

            </div>


            <!-- =========================
                 STATUS
            ========================= -->

            <div class="form-group">

                <label
                    for="status"
                    class="form-label">

                    Status

                </label>


                <select
                    id="status"
                    name="status"
                    class="form-select"
                    required>


                    <option
                        value="Active"
                        th:selected="${course.status == 'Active'}">

                        Active

                    </option>


                    <option
                        value="Inactive"
                        th:selected="${course.status == 'Inactive'}">

                        Inactive

                    </option>


                </select>

            </div>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="button-row">


                <!-- UPDATE -->

                <button
                    type="submit"
                    class="btn update-btn">

                    Update Course

                </button>


                <!-- CANCEL -->

                <a
                    th:href="@{/admin/courses}"
                    class="btn cancel-btn">

                    Cancel

                </a>


            </div>


        </form>


    </div>

</div>


</body>

</html>
