<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #334155;
        }

        .edit-container {
            width: 100%;
            max-width: 560px;
        }

        .edit-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.06);
        }

        .title {
            color: #172554;
            font-size: 27px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            width: 100%;
            min-height: 48px;
            border: 1px solid #dbe3ef;
            border-radius: 7px;
            background-color: #ffffff;
            padding: 10px 13px;
            font-size: 14px;
            color: #334155;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #647ba8;
            box-shadow: 0 0 0 3px rgba(23, 37, 84, 0.08);
        }

        .form-select {
            cursor: pointer;
        }

        textarea.form-control {
            min-height: 95px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 27px;
        }

        .update-btn,
        .cancel-btn {
            flex: 1;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .update-btn {
            background: #172554;
            border: 1px solid #172554;
            color: #ffffff;
        }

        .update-btn:hover {
            background: #243b72;
            border-color: #243b72;
            color: #ffffff;
        }

        .cancel-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
        }

        .cancel-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #172554;
        }

        @media (max-width: 576px) {
            body {
                padding: 18px 12px;
            }

            .edit-card {
                padding: 27px 22px;
            }

            .title {
                font-size: 24px;
                margin-bottom: 23px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .button-row {
                flex-direction: column;
                gap: 10px;
                margin-top: 22px;
            }

            .update-btn,
            .cancel-btn {
                width: 100%;
                flex: auto;
            }
        }

        @media (max-width: 350px) {
            .edit-card {
                padding: 23px 17px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <div class="edit-card">

            <h1 class="title">Edit Course</h1>

            <form th:action="@{/admin/courses/update/{id}(id=${course.id})}"
                  method="post">

                <!-- Course Name -->
                <div class="form-group">

                    <label for="courseName" class="form-label">
                        Course Name
                    </label>

                    <input
                        id="courseName"
                        type="text"
                        name="courseName"
                        th:value="${course.courseName}"
                        class="form-control"
                        placeholder="Enter course name"
                        required>

                </div>

                <!-- Description -->
                <div class="form-group">

                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="3"
                        placeholder="Enter course description"
                        required
                        th:text="${course.description}"></textarea>

                </div>

                <!-- Duration -->
                <div class="form-group">

                    <label for="duration" class="form-label">
                        Duration
                    </label>

                    <input
                        id="duration"
                        type="text"
                        name="duration"
                        th:value="${course.duration}"
                        class="form-control"
                        placeholder="Example: 6 Months"
                        required>

                </div>

                <!-- Fees -->
                <div class="form-group">

                    <label for="fees" class="form-label">
                        Fees
                    </label>

                    <input
                        id="fees"
                        type="number"
                        name="fees"
                        th:value="${course.fees}"
                        class="form-control"
                        placeholder="Enter course fees"
                        min="0"
                        required>

                </div>

                <!-- Mode -->
                <div class="form-group">

                    <label for="mode" class="form-label">
                        Mode
                    </label>

                    <select
                        id="mode"
                        name="mode"
                        class="form-select"
                        required>

                        <option
                            value="Online"
                            th:selected="${course.mode == 'Online'}">
                            Online
                        </option>

                        <option
                            value="Offline"
                            th:selected="${course.mode == 'Offline'}">
                            Offline
                        </option>

                        <option
                            value="Hybrid"
                            th:selected="${course.mode == 'Hybrid'}">
                            Hybrid
                        </option>

                    </select>

                </div>

                <!-- Status -->
                <div class="form-group">

                    <label for="status" class="form-label">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        class="form-select"
                        required>

                        <option
                            value="Active"
                            th:selected="${course.status == 'Active'}">
                            Active
                        </option>

                        <option
                            value="Inactive"
                            th:selected="${course.status == 'Inactive'}">
                            Inactive
                        </option>

                    </select>

                </div>

                <!-- Buttons -->
                <div class="button-row">

                    <button type="submit" class="update-btn">
                        Update Course
                    </button>

                    <a th:href="@{/admin/courses}"
                       class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
