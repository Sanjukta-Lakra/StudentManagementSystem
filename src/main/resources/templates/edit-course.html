<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Course</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Edit Course
                    </h2>


                    <form
                        th:action="@{/admin/courses/update/{id}(id=${course.id})}"
                        method="post">


                        <div class="mb-3">

                            <label class="form-label">
                                Course Name
                            </label>

                            <input
                                type="text"
                                name="courseName"
                                th:value="${course.courseName}"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="3"
                                required
                                th:text="${course.description}">
                            </textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Duration
                            </label>

                            <input
                                type="text"
                                name="duration"
                                th:value="${course.duration}"
                                class="form-control"
                                placeholder="Example: 6 Months"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Fees
                            </label>

                            <input
                                type="number"
                                name="fees"
                                th:value="${course.fees}"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Mode
                            </label>

                            <select
                                name="mode"
                                class="form-select"
                                required>

                                <option value="Online"
                                    th:selected="${course.mode == 'Online'}">
                                    Online
                                </option>

                                <option value="Offline"
                                    th:selected="${course.mode == 'Offline'}">
                                    Offline
                                </option>

                                <option value="Hybrid"
                                    th:selected="${course.mode == 'Hybrid'}">
                                    Hybrid
                                </option>

                            </select>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required>

                                <option value="Active"
                                    th:selected="${course.status == 'Active'}">
                                    Active
                                </option>

                                <option value="Inactive"
                                    th:selected="${course.status == 'Inactive'}">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success">

                            Update Course

                        </button>


                        <a
                            href="/admin/courses"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
