<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        /* ================= NAVBAR ================= */

        .admin-navbar {
            width: 100%;
            background: #172554;
            padding: 15px 35px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .admin-title {
            font-size: 21px;
            font-weight: 600;
            margin: 0;
        }

        .admin-subtitle {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 3px;
        }

        .navbar-buttons {
            display: flex;
            gap: 10px;
        }

        .navbar-buttons a {
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .dashboard-btn {
            background: #2563eb;
            color: white;
        }

        .dashboard-btn:hover {
            background: #1d4ed8;
            color: white;
        }

        .course-btn {
            background: #334155;
            color: white;
        }

        .course-btn:hover {
            background: #475569;
            color: white;
        }

        /* ================= MAIN AREA ================= */

        .main-container {
            width: 92%;
            max-width: 1150px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 22px rgba(15, 23, 42, 0.08);
        }

        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 27px;
            font-weight: 700;
            color: #172554;
        }

        .page-description {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        /* ================= TABLE ================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .student-table {
            width: 100%;
            min-width: 850px;
            margin: 0;
        }

        .student-table thead th {
            background: #172554;
            color: white;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .student-table tbody td {
            padding: 12px 14px;
            font-size: 14px;
            color: #334155;
            vertical-align: middle;
        }

        .student-table tbody tr {
            transition: 0.2s;
        }

        .student-table tbody tr:hover {
            background: #f8fafc;
        }

        /* ================= ID ================= */

        .student-id {
            font-weight: 600;
            color: #2563eb !important;
        }

        /* ================= COURSE ================= */

        .course-name {
        font-weight: 400;
        color: #334155;
        }

        /* ================= ACTION BUTTONS ================= */

        .action-buttons {
            display: flex;
            gap: 7px;
            white-space: nowrap;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 13px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
        }

        .edit-btn:hover {
            background: #1d4ed8;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 13px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
        }

        .delete-btn:hover {
            background: #b91c1c;
            color: white;
        }

        /* ================= EMPTY ================= */

        .no-students {
            text-align: center;
            padding: 35px !important;
            color: #64748b !important;
            font-size: 16px;
        }

        /* ================= BOTTOM BUTTON ================= */

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 9px 18px;
            border: 1px solid #2563eb;
            border-radius: 7px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            .admin-navbar {
                padding: 13px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .navbar-buttons {
                width: 100%;
            }

            .navbar-buttons a {
                flex: 1;
                text-align: center;
            }

            .main-container {
                width: 95%;
                margin: 20px auto;
                padding: 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-title {
                font-size: 24px;
            }

        }

        @media (max-width: 480px) {

            .admin-title {
                font-size: 18px;
            }

            .navbar-buttons {
                flex-direction: column;
            }

            .main-container {
                width: 96%;
                padding: 14px;
            }

            .page-title {
                font-size: 22px;
            }

        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="admin-navbar">

    <div>
        <div class="admin-title">
            🎓 Student Management System
        </div>

        <div class="admin-subtitle">
            Administrator Panel
        </div>
    </div>

    <div class="navbar-buttons">

        <a href="/admin/dashboard"
           class="dashboard-btn">
            🏠 Dashboard
        </a>

        <a href="/admin/courses"
           class="course-btn">
            📚 Manage Course 
        </a>

    </div>

</div>


<!-- ================= MAIN CONTAINER ================= -->

<div class="main-container">

    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1 class="page-title">
                👨‍🎓 Manage Students
            </h1>

            <p class="page-description">
                View, update and manage registered students
            </p>

        </div>

    </div>


    <!-- ================= STUDENT TABLE ================= -->

    <div class="table-container">

        <table class="table table-hover student-table">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Course</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody>

            <!-- STUDENTS -->

            <tr th:each="student : ${students}">

                <td class="student-id"
                    th:text="${student.id}">
                    1
                </td>

                <td th:text="${student.name}">
                    Student Name
                </td>

                <td th:text="${student.email}">
                    student@gmail.com
                </td>

                <td th:text="${student.phone}">
                    9876543210
                </td>

                <td class="course-name"
                    th:text="${student.course}">
                    Java Full Stack
                </td>

                <td>

                    <div class="action-buttons">

                        <!-- EDIT -->

                        <a th:href="@{/admin/students/edit/{id}(id=${student.id})}"
                           class="edit-btn">
                            Edit
                        </a>

                        <!-- DELETE -->

                        <a th:href="@{/admin/students/delete/{id}(id=${student.id})}"
                           class="delete-btn"
                           onclick="return confirm('Are you sure you want to delete this student?');">
                            Delete
                        </a>

                    </div>

                </td>

            </tr>


            <!-- NO STUDENTS -->

            <tr th:if="${#lists.isEmpty(students)}">

                <td colspan="6"
                    class="no-students">

                    👨‍🎓 No students enrolled yet.

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- BACK BUTTON -->

    <div class="text-center">

        <a href="/admin/dashboard"
           class="back-btn">

            🏠 Back to Dashboard

        </a>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
