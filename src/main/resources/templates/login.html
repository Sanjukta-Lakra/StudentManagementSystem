<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {

            background: white;

            border: none;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(15, 23, 42, 0.10);

            width: 100%;
        }


        /* =========================
           LOGO
        ========================= */

        .login-logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #2563eb;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 34px;

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.25);
        }


        /* =========================
           TITLE
        ========================= */

        .login-title {

            text-align: center;

            color: #172554;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .login-subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;
        }


        /* =========================
           ALERTS
        ========================= */

        .alert {

            border-radius: 9px;

            font-size: 14px;

            padding: 11px 13px;

            margin-bottom: 18px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-label {

            color: #334155;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        .form-control {

            min-height: 48px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            padding: 10px 13px;

            transition: 0.2s;
        }


        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            min-height: 48px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;

            display: block;
        }


        .login-btn:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.20);
        }


        .login-btn:active {

            transform: translateY(0);
        }


        .login-btn:disabled {

            cursor: not-allowed;

            opacity: 0.7;

            transform: none;
        }


        /* =========================
           REGISTER SECTION
        ========================= */

        .register-section {

            text-align: center;

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid #e2e8f0;
        }


        .register-text {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .register-link {

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .register-link:hover {

            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .login-footer {

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 20px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 768px) {

            body {

                padding: 18px;
            }

            .login-card {

                padding: 30px;
            }

            .login-title {

                font-size: 25px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;

                align-items: center;
            }


            .login-container {

                max-width: 100%;
            }


            .login-card {

                padding: 25px 20px;

                border-radius: 15px;
            }


            .login-logo {

                width: 60px;

                height: 60px;

                font-size: 29px;

                margin-bottom: 13px;
            }


            .login-title {

                font-size: 23px;
            }


            .login-subtitle {

                font-size: 13px;

                margin-bottom: 21px;
            }


            .form-control {

                min-height: 46px;

                font-size: 14px;
            }


            .login-btn {

                min-height: 46px;

                font-size: 14px;
            }


            .alert {

                font-size: 13px;
            }

        }


        /* =========================
           VERY SMALL MOBILE
        ========================= */

        @media (max-width: 360px) {

            body {

                padding: 10px;
            }


            .login-card {

                padding: 22px 16px;
            }


            .login-title {

                font-size: 21px;
            }


            .login-logo {

                width: 55px;

                height: 55px;

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN CONTAINER
========================= -->

<div class="login-container">


    <!-- LOGIN CARD -->

    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            🎓

        </div>


        <!-- TITLE -->

        <h1 class="login-title">

            Student Login

        </h1>


        <p class="login-subtitle">

            Welcome back! Please login to continue.

        </p>


        <!-- =========================
             ERROR MESSAGE
        ========================= -->

        <div th:if="${param.error}"
             class="alert alert-danger">

            ⚠️ Invalid Email or Password!

        </div>


        <!-- =========================
             LOGOUT MESSAGE
        ========================= -->

        <div th:if="${param.logout}"
             class="alert alert-success">

            ✅ Successfully Logged Out!

        </div>


        <!-- =========================
             REGISTRATION SUCCESS
        ========================= -->

        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">

            Registration Successful! Please login.

        </div>


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form
            th:action="@{/login}"
            method="post">


            <!-- CSRF TOKEN -->

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- =========================
                 EMAIL
            ========================= -->

            <div class="form-group">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>


                <input
                    id="email"
                    type="email"
                    name="username"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- =========================
                 PASSWORD
            ========================= -->

            <div class="form-group">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>


                <input
                    id="password"
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <!-- =========================
                 LOGIN BUTTON
            ========================= -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                Login

            </button>


        </form>


        <!-- =========================
             REGISTER
        ========================= -->

        <div class="register-section">

            <div class="register-text">

                Don't have an account?

            </div>


            <a
                th:href="@{/register}"
                class="register-link">

                Create New Student Account →

            </a>

        </div>


    </div>


    <!-- =========================
         FOOTER
    ========================= -->

    <div class="login-footer">

        Student Management System

    </div>


</div>


<!-- =========================
     LOGIN SCRIPT
========================= -->

<script>

    document.querySelector("form")
        .addEventListener("submit", function() {

            const button =
                document.getElementById("loginButton");

            button.disabled = true;

            button.textContent = "Logging in...";

        });

</script>


</body>

</html>
