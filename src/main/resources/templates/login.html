<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #334155;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        /* Home Link */
        .home-link {
            display: inline-block;
            color: #172554;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 16px;
            padding: 9px 15px;
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 6px;
            transition: 0.2s;
        }

        .home-link:hover {
            background: #172554;
            color: white;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 12px;
            padding: 38px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.06);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h2 {
            color: #172554;
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        .alert {
            border-radius: 8px;
            font-size: 13px;
            padding: 11px 14px;
        }

        .form-label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            border: 1px solid #dbe3ef;
            border-radius: 7px;
            background: #ffffff;
            padding: 10px 13px;
            font-size: 14px;
            color: #334155;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            border-color: #647ba8;
            box-shadow: 0 0 0 3px rgba(23, 37, 84, 0.08);
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 21px;
        }

        .password-input {
            padding-right: 65px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: calc(50% + 12px);
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #172554;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 3px 0 24px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
        }

        .remember-label input {
            width: 15px;
            height: 15px;
            accent-color: #172554;
        }

        .forgot-link {
            color: #172554;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 7px;
            background: #172554;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background: #243b72;
        }

        .register-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 21px;
            border-top: 1px solid #edf0f5;
            color: #64748b;
            font-size: 13px;
        }

        .register-section a {
            color: #172554;
            font-weight: 700;
            text-decoration: none;
            margin-left: 3px;
        }

        .register-section a:hover {
            text-decoration: underline;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .login-header h2 {
                font-size: 24px;
            }
        }

        @media (max-width: 350px) {
            .login-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Back to Home -->
        <a th:href="@{ / }" class="home-link">
            ← Back to Home
        </a>

        <div class="login-card">

            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your account.</p>
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}"
                 class="alert alert-danger">
                Invalid email or password.
            </div>

            <!-- Logout Message -->
            <div th:if="${param.logout}"
                 class="alert alert-success">
                You have been logged out successfully.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">

                <div class="input-wrapper">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="input-wrapper">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        id="passwordToggle">
                        Show
                    </button>
                </div>

                <div class="login-options">
                    <label class="remember-label">
                        <input
                            type="checkbox"
                            name="remember-me">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>

            <!-- Register Link -->
            <div class="register-section">
                Don't have an account?
                <a th:href="@{/register}">
                    Create an account
                </a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                Student Management System
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const toggle = document.getElementById("passwordToggle");

            if (password.type === "password") {
                password.type = "text";
                toggle.textContent = "Hide";
            } else {
                password.type = "password";
                toggle.textContent = "Show";
            }
        }
    </script>

</body>
</html>
