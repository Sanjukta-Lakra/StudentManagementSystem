<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        .edit-container {
            max-width: 900px;
            margin: auto;
        }

        .edit-card {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .title {
            color: #14213d;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 8px;
            font-size: 17px;
        }

        .form-select {
            cursor: pointer;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .update-btn,
        .cancel-btn {
            min-height: 46px;
            padding: 8px 20px;
            border-radius: 8px;
        }

        @media (max-width: 576px) {

            .edit-card {
                padding: 25px 20px;
            }

            .title {
                font-size: 28px;
            }

            .button-row {
                flex-direction: column;
            }

            .button-row button,
            .button-row a {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="edit-container">

    <div class="edit-card">


        <!-- TITLE -->

        <h1 class="title">
            Edit Student
        </h1>


        <!-- FORM -->

        <form
            th:action="@{/admin/students/update/{id}(id=${student.id})}"
            method="post">


            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    th:value="${student.name}"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    th:value="${student.email}"
                    required>

            </div>


            <!-- PHONE -->

            <div class="mb-3">

                <label class="form-label">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    th:value="${student.phone}"
                    maxlength="10"
                    required>

            </div>


            <!-- ========================= -->
            <!-- ALL AVAILABLE COURSES -->
            <!-- ========================= -->

            <div class="mb-4">

                <label class="form-label">
                    Select Course
                </label>

                <select
                    name="course"
                    class="form-select"
                    required>

                    <!-- DEFAULT -->

                    <option value="">
                        -- Select Course --
                    </option>


                    <!-- ALL COURSES FROM DATABASE -->

                    <option
                        th:each="course : ${courses}"
                        th:value="${course.courseName}"
                        th:text="${course.courseName}"
                        th:selected="${course.courseName == student.course}">
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="button-row">

                <button
                    type="submit"
                    class="btn btn-success update-btn">

                    Update Student

                </button>


                <a
                    href="/admin/students"
                    class="btn btn-secondary cancel-btn">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>


</body>

</html>
