<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Course</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .course-card {
            border: none;
            border-radius: 15px;
        }

        .course-title {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 10px;
        }

        .btn {
            border-radius: 8px;
        }

        @media (max-width: 576px) {

            .container {
                margin-top: 25px !important;
            }

            .card-body {
                padding: 20px !important;
            }

            h2 {
                font-size: 24px;
            }

            .btn {
                width: 100%;
                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9 col-sm-12">


            <div class="card shadow course-card">

                <div class="card-body p-4">


                    <h2 class="text-center mb-4 course-title">
                        Add New Course
                    </h2>


                    <!-- Add Course Form -->

                    <form
                        th:action="@{/admin/courses/save}"
                        method="post">


                        

                        <!-- Course Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Course Name
                            </label>

                            <input
                                type="text"
                                name="courseName"
                                class="form-control"
                                placeholder="Enter course name"
                                required>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter course description"
                                required></textarea>

                        </div>


                        <!-- Duration -->

                        <div class="mb-3">

                            <label class="form-label">
                                Duration
                            </label>

                            <input
                                type="text"
                                name="duration"
                                class="form-control"
                                placeholder="Example: 6 Months"
                                required>

                        </div>


                        <!-- Fees -->

                        <div class="mb-3">

                            <label class="form-label">
                                Fees
                            </label>

                            <input
                                type="number"
                                name="fees"
                                class="form-control"
                                placeholder="Enter course fees"
                                min="0"
                                required>

                        </div>


                        <!-- Mode -->

                        <div class="mb-3">

                            <label class="form-label">
                                Mode
                            </label>

                            <select
                                name="mode"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Select Mode --
                                </option>

                                <option value="Online">
                                    Online
                                </option>

                                <option value="Offline">
                                    Offline
                                </option>

                                <option value="Hybrid">
                                    Hybrid
                                </option>

                            </select>

                        </div>


                        <!-- Status -->

                        <div class="mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required>

                                <option value="Active">
                                    Active
                                </option>

                                <option value="Inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Add Course

                            </button>


                            <a
                                href="/admin/courses"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
