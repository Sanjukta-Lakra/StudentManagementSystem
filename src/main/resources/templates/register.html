<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #eff6ff,
                #f8fafc
            );

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .register-container {
            width: 100%;
            max-width: 560px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {
            background: #ffffff;

            border: none;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 10px 35px rgba(15, 23, 42, 0.10);

            width: 100%;
        }


        /* =========================
           LOGO
        ========================= */

        .register-logo {

            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #2563eb;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.25);
        }


        /* =========================
           TITLE
        ========================= */

        .register-title {

            text-align: center;

            color: #172554;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .register-subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .alert {

            border-radius: 9px;

            font-size: 14px;

            padding: 11px 13px;

            margin-bottom: 20px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 17px;
        }


        .form-label {

            color: #334155;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        .form-control,
        .form-select {

            min-height: 47px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 14px;

            padding: 10px 13px;

            transition: 0.2s;
        }


        .form-control:focus,
        .form-select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            min-height: 48px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }


        .register-btn:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.20);
        }


        .register-btn:active {

            transform: translateY(0);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-section {

            text-align: center;

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid #e2e8f0;
        }


        .login-text {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .login-link {

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .login-link:hover {

            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .register-footer {

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 18px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 768px) {

            body {

                padding: 20px 15px;
            }

            .register-card {

                padding: 28px;
            }

            .register-title {

                font-size: 25px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 15px 10px;

                align-items: center;
            }


            .register-container {

                max-width: 100%;
            }


            .register-card {

                padding: 24px 18px;

                border-radius: 15px;
            }


            .register-logo {

                width: 58px;

                height: 58px;

                font-size: 27px;

                margin-bottom: 12px;
            }


            .register-title {

                font-size: 22px;
            }


            .register-subtitle {

                font-size: 13px;

                margin-bottom: 20px;
            }


            .form-group {

                margin-bottom: 15px;
            }


            .form-label {

                font-size: 13px;
            }


            .form-control,
            .form-select {

                min-height: 45px;

                font-size: 14px;
            }


            .register-btn {

                min-height: 46px;

                font-size: 14px;
            }


            .alert {

                font-size: 13px;
            }


            .login-text,
            .login-link {

                font-size: 13px;
            }
        }


        /* =========================
           VERY SMALL MOBILE
        ========================= */

        @media (max-width: 360px) {

            body {

                padding: 10px 8px;
            }


            .register-card {

                padding: 20px 15px;
            }


            .register-logo {

                width: 52px;

                height: 52px;

                font-size: 24px;
            }


            .register-title {

                font-size: 20px;
            }


            .register-subtitle {

                font-size: 12px;
            }


            .form-control,
            .form-select {

                min-height: 43px;

                font-size: 13px;
            }


            .register-btn {

                min-height: 44px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     REGISTER CONTAINER
========================= -->

<div class="register-container">


    <!-- REGISTER CARD -->

    <div class="register-card">


        <!-- LOGO -->

        <div class="register-logo">

            🎓

        </div>


        <!-- TITLE -->

        <h1 class="register-title">

            Student Registration

        </h1>


        <p class="register-subtitle">

            Create your account and start learning.

        </p>


        <!-- ERROR MESSAGE -->

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">

        </div>


        <!-- =========================
             REGISTRATION FORM
        ========================= -->

        <form
            th:action="@{/register}"
            method="post">


            <!-- CSRF TOKEN -->

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- FULL NAME -->

            <div class="form-group">

                <label
                    for="name"
                    class="form-label">

                    Full Name

                </label>


                <input
                    id="name"
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>


                <input
                    id="email"
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label
                    for="phone"
                    class="form-label">

                    Phone Number

                </label>


                <input
                    id="phone"
                    type="tel"
                    name="phone"
                    class="form-control"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    pattern="[6-9][0-9]{9}"
                    autocomplete="tel"
                    required>

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label
                    for="course"
                    class="form-label">

                    Select Course

                </label>


                <select
                    id="course"
                    name="course"
                    class="form-select"
                    required>

                    <option value="">

                        -- Select Course --

                    </option>


                    <option
                        th:each="course : ${courses}"
                        th:value="${course.courseName}"
                        th:text="${course.courseName}">

                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>


                <input
                    id="password"
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    minlength="8"
                    autocomplete="new-password"
                    required>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn">

                📝 Register

            </button>


        </form>


        <!-- LOGIN SECTION -->

        <div class="login-section">

            <div class="login-text">

                Already have an account?

            </div>


            <a
                th:href="@{/login}"
                class="login-link">

                Login to Your Account →

            </a>

        </div>


    </div>


    <!-- FOOTER -->

    <div class="register-footer">

        Student Management System

    </div>


</div>


</body>

</html>
