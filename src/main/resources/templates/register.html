<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 540px;
        }

        /* HOME LINK */
        .home-link {
            display: inline-block;
            color: #172554;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 16px;
            padding: 9px 15px;
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 6px;
            transition: 0.2s;
        }

        .home-link:hover {
            background: #172554;
            color: #ffffff;
        }

        /* REGISTER CARD */
        .register-card {
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        /* HEADER */
        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-title {
            color: #172554;
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        .register-subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* ALERT */
        .alert {
            border-radius: 8px;
            font-size: 14px;
            padding: 11px 13px;
            margin-bottom: 20px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 19px;
        }

        .form-label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            width: 100%;
            min-height: 46px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            padding: 10px 13px;
            color: #334155;
            background-color: #ffffff;
            transition: 0.2s;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            outline: none;
        }

        /* REGISTER BUTTON */
        .register-btn {
            width: 100%;
            min-height: 47px;
            border: none;
            border-radius: 7px;
            background: #172554;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #243b72;
            box-shadow: 0 4px 12px rgba(23, 37, 84, 0.16);
        }

        /* LOGIN SECTION */
        .login-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5eaf2;
        }

        .login-text {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .login-link {
            color: #172554;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .login-link:hover {
            color: #243b72;
            text-decoration: underline;
        }

        /* FOOTER */
        .register-footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 20px;
        }

        /* TABLET */
        @media (max-width: 768px) {
            .register-card {
                padding: 30px;
            }

            .register-title {
                font-size: 25px;
            }
        }

        /* MOBILE */
        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .register-card {
                padding: 25px 19px;
                border-radius: 10px;
            }

            .register-title {
                font-size: 23px;
            }

            .register-subtitle {
                font-size: 13px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-label {
                font-size: 13px;
            }

            .form-control,
            .form-select {
                min-height: 44px;
                font-size: 14px;
            }

            .register-btn {
                min-height: 45px;
                font-size: 14px;
            }

            .login-text,
            .login-link {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- BACK TO HOME -->
        <a th:href="@{/}" class="home-link">
            ← Back to Home
        </a>

        <!-- REGISTER CARD -->
        <div class="register-card">

            <!-- HEADER -->
            <div class="register-header">
                <h1 class="register-title">
                    Student Registration
                </h1>

                <p class="register-subtitle">
                    Create your account and start learning.
                </p>
            </div>

            <!-- ERROR MESSAGE -->
            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <!-- REGISTRATION FORM -->
            <form th:action="@{/register}" method="post">

                <!-- FULL NAME -->
                <div class="form-group">
                    <label for="name" class="form-label">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <!-- PHONE -->
                <div class="form-group">
                    <label for="phone" class="form-label">
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        name="phone"
                        class="form-control"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        pattern="[6-9][0-9]{9}"
                        autocomplete="tel"
                        required>
                </div>

                <!-- COURSE -->
                <div class="form-group">
                    <label for="course" class="form-label">
                        Select Course
                    </label>

                    <select
                        id="course"
                        name="course"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Course --
                        </option>

                        <option
                            th:each="course : ${courses}"
                            th:value="${course.courseName}"
                            th:text="${course.courseName}">
                        </option>

                    </select>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required>
                </div>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="register-btn">
                    Register
                </button>

            </form>

            <!-- LOGIN SECTION -->
            <div class="login-section">

                <div class="login-text">
                    Already have an account?
                </div>

                <a th:href="@{/login}" class="login-link">
                    Login to Your Account
                </a>

            </div>

        </div>

        <!-- FOOTER -->
        <div class="register-footer">
            Student Management System
        </div>

    </div>

</body>
</html>
